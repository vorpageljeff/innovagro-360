# Combine with compose.hostinger-crm.yml. No additional public port.
services:
  api:
    networks: [private, proxy, evolution]
  evolution:
    image: evoapicloud/evolution-api:v2.3.7
    restart: unless-stopped
    env_file: ../.env.evolution
    volumes: [evolution_instances:/evolution/instances]
    networks: [evolution]
    depends_on:
      evolution_db: {condition: service_healthy}
      evolution_redis: {condition: service_healthy}
  evolution_db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: ../.env.evolution
    volumes: [evolution_postgres:/var/lib/postgresql/data]
    networks: [evolution]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 20
  evolution_redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: [redis-server, --appendonly, 'yes']
    volumes: [evolution_redis:/data]
    networks: [evolution]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 20
networks:
  evolution:
volumes:
  evolution_instances:
  evolution_postgres:
  evolution_redis:
